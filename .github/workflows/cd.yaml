name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: whoami-ec2         # Un seul déploiement actif sur cet EC2.
  cancel-in-progress: false # Un nouveau push laisse le déploiement actif finir.

jobs:
    deploy:
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push'
        
        runs-on: ubuntu-latest
        
        steps:
            - name: Déployer sur EC2 via SSH
              uses: appleboy/ssh-action@v1.2.0
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USERNAME }}
                key: ${{ secrets.EC2_SSH_KEY }} 
                fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
                script: |
                    set -e
                    IMAGE="${{ secrets.DOCKER_USERNAME }}/whom:${{ github.event.workflow_run.head_sha }}"

                    echo "[1/4] Télécharger la nouvelle image"
                    sudo docker pull "$IMAGE"

                    echo "[2/4] Retirer l'ancien conteneur s'il existe"
                    if sudo docker container inspect notes-api >/dev/null 2>&1; then
                    sudo docker stop notes-api
                    sudo docker rm notes-api
                    fi

                    echo "[3/4] Démarrer le nouveau conteneur"
                    sudo docker run -d \
                    --name notes-api \
                    --restart unless-stopped \
                    -p 127.0.0.1:8000:8000 \
                    "$IMAGE"

                    echo "[4/4] Vérifier que l'API répond"
                    curl --fail --show-error --silent \
                    --retry 10 --retry-connrefused --max-time 5 \
                    http://127.0.0.1:8000/health
                    